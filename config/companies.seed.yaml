# Company registry SEED. Loaded into the DB once; the DB (company / company_source
# tables) is the source of truth thereafter. The seed is versioned config so the
# initial universe is reproducible and reviewable.
#
# NOTE: pipeline URLs are best-effort anchors for the largest-cap pharma. They MUST
# be verified during M1 rendering (sites move pages); fix in the DB or re-seed.
# render_config overrides (waits, click-to-expand selectors, pagination) are added
# per-site in M1 as we see how each page actually renders. Empty = Playwright defaults.
#
# Universe = top global pharma/biotech by market cap — the investing-relevant set.
# Designed to grow to ~200 then 500+ without schema change.

