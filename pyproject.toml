[project]
name = "pipeline-intel"
version = "0.1.0"
description = "Pharma pipeline intelligence database — commercial dataset of company-disclosed drug pipelines for investors"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "playwright>=1.45",
    "pillow>=10.4",
    "anthropic>=0.50",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-ulid>=2.7",
    "tenacity>=8.3",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.scripts]
pipeline = "pipeline_intel.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline_intel"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
