services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pipeline-intel-db
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: pipeline_intel
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d pipeline_intel"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  pgdata:
